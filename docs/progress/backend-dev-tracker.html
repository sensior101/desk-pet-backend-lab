<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>백엔드 개발 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8;--panel:#ffffff;--panel-2:#fafbfc;--text:#191c24;--muted:#6c7386;--faint:#a3a9b8;--line:#e6e8ee;
  --accent:#4f6bed;--accent-soft:#eef1fe;
  --done:#1f9d6b;--done-bg:#e5f6ee;--doing:#e0861a;--doing-bg:#fdf0dc;--todo:#6e7790;--todo-bg:#eef0f5;
  --danger:#d64545;--shadow:0 1px 2px rgba(20,24,36,.04),0 4px 16px rgba(20,24,36,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1116;--panel:#171a21;--panel-2:#1b1f27;--text:#e8eaf0;--muted:#9aa1b2;--faint:#636a7b;--line:#272c36;
  --accent:#7d93ff;--accent-soft:#1f2640;
  --done:#47c690;--done-bg:#17302a;--doing:#f2a546;--doing-bg:#352914;--todo:#9aa3b8;--todo-bg:#232833;
  --danger:#ff7070;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#0f1116;--panel:#171a21;--panel-2:#1b1f27;--text:#e8eaf0;--muted:#9aa1b2;--faint:#636a7b;--line:#272c36;
  --accent:#7d93ff;--accent-soft:#1f2640;
  --done:#47c690;--done-bg:#17302a;--doing:#f2a546;--doing-bg:#352914;--todo:#9aa3b8;--todo-bg:#232833;
  --danger:#ff7070;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:14px/1.55 Pretendard,"Noto Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:24px 16px 40px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em;margin-bottom:4px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.icon{padding:8px 10px}

/* summary */
.summary{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:12px;margin-bottom:18px}
@media (max-width:820px){.summary{grid-template-columns:1fr 1fr}}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.sum .k{font-size:12px;color:var(--muted);font-weight:500}
.sum .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.sum .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.bar{height:8px;border-radius:99px;background:var(--todo-bg);overflow:hidden;display:flex;margin-top:10px}
.bar i{display:block;height:100%}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;margin:0}
.card-b{padding:14px 16px}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
@media (max-width:980px){.side{position:static}}

/* tabs */
.seg{display:inline-flex;background:var(--todo-bg);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .cnt{font-size:11px;color:var(--faint);margin-left:4px}
.search{flex:1;min-width:140px;max-width:220px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}

/* timeline list */
.phase{margin:18px 0 8px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.phase:first-child{margin-top:4px}
.phase .chev{color:var(--faint);transition:.15s;font-size:11px}
.phase.closed .chev{transform:rotate(-90deg)}
.phase .ph-t{font-size:13px;font-weight:700}
.phase .ph-c{font-size:12px;color:var(--muted)}
.phase .ph-bar{flex:1;height:4px;border-radius:99px;background:var(--todo-bg);overflow:hidden;max-width:120px;margin-left:auto}
.phase .ph-bar i{display:block;height:100%;background:var(--done)}
.items{position:relative;padding-left:18px}
.items::before{content:"";position:absolute;left:13px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.item{position:relative;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 12px;margin:0 0 6px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--accent);transform:translateX(2px)}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item.dragging{opacity:.4}
.num{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--todo-bg);color:var(--todo);position:relative;z-index:1}
.item.done .num{background:var(--done-bg);color:var(--done)}
.item.doing .num{background:var(--doing-bg);color:var(--doing)}
.item.done .title{color:var(--muted)}
.title{font-weight:600;word-break:keep-all;line-height:1.4}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--muted)}
.meta .late{color:var(--danger);font-weight:600}
.owner{font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.owner.other{background:var(--todo-bg);color:var(--muted)}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-done{background:var(--done-bg);color:var(--done)}.p-doing{background:var(--doing-bg);color:var(--doing)}.p-todo{background:var(--todo-bg);color:var(--todo)}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:13px}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav strong{min-width:96px;text-align:center;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;color:var(--faint);text-align:center;padding:2px 0 4px;font-weight:600}
.dow:first-child{color:var(--danger)}
.day{min-height:74px;border-radius:10px;padding:5px;font-size:11px;background:var(--panel-2);border:1px solid transparent;overflow:hidden;transition:.15s}
.day.other{opacity:.35}
.day.today{border-color:var(--accent);background:var(--accent-soft)}
.day.drop{border:1px dashed var(--accent)}
.dnum{font-weight:600;font-size:12px;margin-bottom:3px;color:var(--muted)}
.day.today .dnum{color:var(--accent)}
.chip{display:block;padding:2px 6px;border-radius:6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:500}
.chip.done{background:var(--done-bg);color:var(--done)}.chip.doing{background:var(--doing-bg);color:var(--doing)}.chip.todo{background:var(--todo-bg);color:var(--todo)}
.more{font-size:10px;color:var(--faint);padding-left:4px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}

/* detail */
.detail label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.detail label:first-of-type{margin-top:0}
.detail input,.detail select,.detail textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);outline:none;transition:.15s}
.detail input:focus,.detail select:focus,.detail textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.detail textarea{min-height:130px;resize:vertical;line-height:1.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.status-pick button{border:1px solid var(--line);background:var(--panel-2);padding:8px 0;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.status-pick button.on.done{background:var(--done-bg);color:var(--done);border-color:var(--done)}
.status-pick button.on.doing{background:var(--doing-bg);color:var(--doing);border-color:var(--doing)}
.status-pick button.on.todo{background:var(--todo-bg);color:var(--text);border-color:var(--todo)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.saved{font-size:12px;color:var(--done);opacity:0;transition:.3s}
.saved.show{opacity:1}
.hint{font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">DESK PET · BACKEND</div>
      <h1>백엔드 개발 트래커</h1>
      <div class="sub">desk-pet-backend 개발 순서 · 이 브라우저에 자동 저장</div>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="addBtn">+ 업무 추가</button>
      <button class="btn" id="exportBtn">내보내기</button>
      <button class="btn" id="importBtn">가져오기</button>
      <button class="btn" id="resetBtn" title="처음 목록으로 되돌리기">초기화</button>
      <button class="btn icon" id="themeBtn" title="테마 바꾸기">◐</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="grid">
    <section class="card">
      <div class="card-h">
        <div class="seg" id="tabs"></div>
        <input class="search" id="search" placeholder="검색">
      </div>
      <div class="card-b" id="list"></div>
    </section>

    <div class="side">
      <section class="card">
        <div class="card-h">
          <h2>일정</h2>
          <div class="cal-nav">
            <button class="btn icon" id="prevM">‹</button><strong id="calTitle"></strong><button class="btn icon" id="nextM">›</button>
            <button class="btn" id="todayBtn">오늘</button>
          </div>
        </div>
        <div class="card-b">
          <div class="cal" id="cal"></div>
          <div class="legend">
            <span><span class="dot" style="background:var(--done)"></span>진행 완료</span>
            <span><span class="dot" style="background:var(--doing)"></span>진행 중</span>
            <span><span class="dot" style="background:var(--todo)"></span>진행 예정</span>
            <span class="hint">업무를 날짜로 끌어다 놓으면 일정이 잡혀요</span>
          </div>
        </div>
      </section>
      <section class="card">
        <div class="card-h"><h2>업무 상세</h2><span class="saved" id="saved">저장됨</span></div>
        <div class="card-b detail" id="detail"></div>
      </section>
    </div>
  </div>
</div>

<script>
const KEY = "deskpet-backend-tracker-v2";
const ME = "이서현";
const ST = {done:"진행 완료", doing:"진행 중", todo:"진행 예정"};
const P = {
  setup:"1. 설계·셋업 (10월 초)",
  impl1:"2. 1차 구현 (10월 중·말)",
  deploy:"3. 요청 형식 변경·배포 (11/1)",
  week:"4. 이번 주 — 10/29 회의 액션",
  eureka:"5. 백엔드 3번 — Eureka 업무 처리",
  output:"6. 백엔드 5번 — 출력 생성",
  ops:"7. 배포·연동",
  later:"8. 여유 있을 때 — 선제 알림 (1차 제외)",
  team:"9. 팀과 정할 것"
};
const S = (phase, title, status, date, owner, memo) => ({phase:P[phase], title, status, date, owner, memo});
const SEED = [
  S("setup","백엔드 레포 초기 구조·문서 작성","done","2026-10-08",ME,"desk-pet-backend 초기 커밋, 디렉터리 구조와 임시 문서."),
  S("setup","1차 아키텍처·레이어 간 계약(contracts.md) 작성","done","2026-10-08","팀","10/08 멘토 기술 검토: 구현 가능, AI·백엔드 레이어 단순화 필요.\nknowledge: outputs/2026-10-08-tech-review"),
  S("setup","1차 최소 비용 조사","done","2026-10-08","팀","knowledge: outputs/2026-10-08-mvp-cost-research"),
  S("setup","API를 10/07 하드웨어 결정(Mock Server 형식)에 맞춤","done","2026-10-08","Claire",""),
  S("setup","1차 프로젝트 구조 셋업 + 폴더별 README (PR #1)","done","2026-10-14","Claire","api → services → eureka·db 한 방향 구조.\npyproject BOM 제거, 불필요 의존성 정리."),
  S("impl1","AI 평가셋 20개 + Gemini Flash-Lite AI 레이어(ai.py)","done","2026-10-13","박시현","tests/eval/utterances.jsonl, services/ai.py"),
  S("impl1","실제 Eureka 등록·목록 조회 검증","done","2026-10-15",ME,"knowledge: outputs/2026-10-15-backend-eureka-progress"),
  S("impl1","10/01 피드백·10/08 기술 검토 반영 정리","done","2026-10-15","팀","knowledge: outputs/2026-10-15-feedback-reflection"),
  S("impl1","Eureka 등록·조회 + /api/text·/api/voice 연결 (PR #3)","done","2026-10-28",ME,"tasks.handle(): create_task, list_tasks, clarify.\n토큰 401, WAV 검사 413/422."),
  S("impl1","ai.analyze()를 백엔드에 연결, schemas.Decision 통일 (PR #4)","done","2026-10-28","박시현",""),
  S("impl1","기본 모델을 gemini-3.5-flash-lite로 맞춤 (PR #5)","done","2026-10-29","박시현",""),
  S("impl1","10/29 멘토 미팅 — 하드웨어·백엔드 인터페이스 확정","done","2026-10-29","팀","request_id 응답에만, user_id 선택, WebSocket 선제 알림 1차 제외.\n백엔드 1·3·5번 이서현 / 2·4번 박시현."),
  S("deploy","요청 형식 변경: request_id 제거, user_id 선택 (PR #6)","done","2026-11-01",ME,"main 머지 0c714f6. pytest 38 통과."),
  S("deploy","캡스톤 AWS 계정·IAM 사용자 설정","done","2026-11-01",ME,"무료 플랜. 서울 리전은 계정 제한으로 막혀 있어 시드니 사용."),
  S("deploy","EC2(시드니)에 /api/voice 배포 — A4","done","2026-11-01",ME,"http://3.104.122.146:8000\n실제 Gemini·실제 Eureka 연결."),
  S("deploy","공용 Gemini 키로 교체, 기기 토큰 재발급","done","2026-11-01",ME,"음성 조회 응답 약 3.3초."),
  S("deploy","배포 기록 문서화 (knowledge PR #10)","done","2026-11-01",ME,"outputs/2026-11-01-backend-aws-deploy"),
  S("week","A5: 하드웨어 팀에 주소·토큰·요청 형식 전달","doing","2026-11-02",ME,"김리윤, 김지훈에게 DM.\naudio만 필수, user_id 선택, X-Device-Token 헤더.\n등록 테스트는 이름에 '테스트' 붙이기."),
  S("week","A7: 박시현과 handle() ↔ analyze() 입출력 정리","todo","2026-11-03",ME,"pending(재질문) 사용 방식, clarify 질문 문구 담당 정하기."),
  S("eureka","EurekaClient.complete_task() 구현","todo","2026-11-03",ME,"eureka.py:142\n예시: tests/integration/Eureka_Process_API_Test/eureka_task_complete.py"),
  S("eureka","EurekaClient.update_due() 구현","todo","2026-11-04",ME,"eureka.py:147\n예시: eureka_task_update.py"),
  S("eureka","tasks.handle()에 complete_task 연결","todo","2026-11-04",ME,"대상 없음/여러 개 → 재질문"),
  S("eureka","tasks.handle()에 update_due 연결","todo","2026-11-05",ME,"미래 시각 검증"),
  S("eureka","tasks.handle()에 set_reminder 연결","todo","2026-11-05",ME,"offset_minutes ≥ 1 → db.set_reminder()"),
  S("eureka","새 action 3개 테스트 추가","todo","2026-11-06",ME,"tests/test_tasks.py — 성공 / 재질문 / 실패"),
  S("output","새 action 응답 문구·표정 템플릿 정리","todo","2026-11-06",ME,"expression 값 목록을 하드웨어 팀과 맞추기"),
  S("output","9초 제한 재측정 (완료·수정 포함)","todo","2026-11-07",ME,""),
  S("ops","서버 재배포 스크립트 만들기","todo","2026-11-07",ME,"git archive → scp → docker compose up -d --build"),
  S("ops","하드웨어 연동 테스트","todo","2026-11-10","팀","다음 주~다다음 주"),
  S("later","EurekaClient.get_status() 구현","todo","",ME,"eureka.py:152"),
  S("later","reminder.check_once() 구현","todo","",ME,"60초 폴링, 마감 임박 → WebSocket"),
  S("later","resend_undelivered() + 연결 시 재전송","todo","",ME,"ws.py:26"),
  S("later","앱 시작 시 알림 루프 실행 (lifespan)","todo","",ME,"main.py:14"),
  S("team","유료 플랜 전환 후 서울 리전으로 재배포","todo","","팀","옮긴 뒤 시드니 인스턴스 종료"),
  S("team","루트 MFA, 팀원별 IAM 사용자","todo","","팀","")
];

let tasks, filter = "all", q = "", selId = null, closed = new Set(), dragId = null;
const now = new Date(); let viewY = now.getFullYear(), viewM = now.getMonth();
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayStr = ymd(now);
const md = s => { const [, m, d] = s.split("-"); return `${+m}/${+d}`; };
const $ = id => document.getElementById(id);

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { tasks = JSON.parse(raw); return; } } catch(e){}
  tasks = SEED.map(t => ({id:uid(), ...t}));
}
let savedTimer;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e){}
  const el = $("saved"); el.classList.add("show"); clearTimeout(savedTimer); savedTimer = setTimeout(() => el.classList.remove("show"), 900);
}
function setTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; try{localStorage.setItem(KEY+"-theme", t||"")}catch(e){} }

function render(){ renderSummary(); renderTabs(); renderList(); renderCal(); renderDetail(); }

function renderSummary(){
  const n = s => tasks.filter(t => t.status === s).length, total = tasks.length || 1;
  const d = n("done"), g = n("doing"), t = n("todo"), pct = Math.round(d / total * 100);
  const next = tasks.filter(x => x.status !== "done" && x.date).sort((a,b) => a.date.localeCompare(b.date))[0];
  $("summary").innerHTML = `
    <div class="sum"><div class="k">전체 진행률</div><div class="v">${pct}%<small>${d} / ${tasks.length}</small></div>
      <div class="bar"><i style="width:${d/total*100}%;background:var(--done)"></i><i style="width:${g/total*100}%;background:var(--doing)"></i></div></div>
    <div class="sum"><div class="k"><span class="dot" style="background:var(--done)"></span>진행 완료</div><div class="v">${d}</div></div>
    <div class="sum"><div class="k"><span class="dot" style="background:var(--doing)"></span>진행 중</div><div class="v">${g}</div></div>
    <div class="sum"><div class="k"><span class="dot" style="background:var(--todo)"></span>진행 예정</div><div class="v">${t}<small>${next ? "다음 " + md(next.date) : ""}</small></div></div>`;
}
function renderTabs(){
  const c = s => s === "all" ? tasks.length : tasks.filter(t => t.status === s).length;
  $("tabs").innerHTML = [["all","전체"],["doing","진행 중"],["todo","진행 예정"],["done","진행 완료"]]
    .map(([k,v]) => `<button class="${filter===k?"on":""}" data-f="${k}">${v}<span class="cnt">${c(k)}</span></button>`).join("");
}
function renderList(){
  const el = $("list");
  const rows = tasks.map((t,i) => ({t, n:i+1}))
    .filter(x => (filter === "all" || x.t.status === filter) && (!q || (x.t.title + " " + x.t.memo + " " + x.t.owner).toLowerCase().includes(q)));
  if (!rows.length) { el.innerHTML = `<div class="empty">해당하는 업무가 없어요.</div>`; return; }
  const groups = [];
  for (const r of rows) { const last = groups[groups.length-1]; if (last && last.phase === r.t.phase) last.rows.push(r); else groups.push({phase:r.t.phase, rows:[r]}); }
  el.innerHTML = groups.map(g => {
    const all = tasks.filter(t => t.phase === g.phase), dn = all.filter(t => t.status === "done").length;
    const isClosed = closed.has(g.phase);
    return `<div class="phase ${isClosed?"closed":""}" data-phase="${esc(g.phase)}">
        <span class="chev">▼</span><span class="ph-t">${esc(g.phase || "기타")}</span><span class="ph-c">${dn}/${all.length}</span>
        <span class="ph-bar"><i style="width:${all.length?dn/all.length*100:0}%"></i></span></div>
      ${isClosed ? "" : `<div class="items">${g.rows.map(({t,n}) => {
        const late = t.date && t.status !== "done" && t.date < todayStr;
        return `<div class="item ${t.status} ${t.id===selId?"sel":""}" draggable="true" data-id="${t.id}">
          <div class="num">${t.status==="done"?"✓":n}</div>
          <div><div class="title">${esc(t.title)}</div>
            <div class="meta">
              ${t.owner ? `<span class="owner ${t.owner===ME?"":"other"}">${esc(t.owner)}</span>` : ""}
              <span class="${late?"late":""}">${t.date ? md(t.date) + (late?" · 지남":"") : "일정 없음"}</span>
              ${t.memo ? `<span>메모 있음</span>` : ""}
            </div></div>
          <span class="pill p-${t.status}">${ST[t.status]}</span></div>`;}).join("")}</div>`}`;
  }).join("");
}
function renderCal(){
  $("calTitle").textContent = `${viewY}년 ${viewM+1}월`;
  const first = new Date(viewY, viewM, 1), start = new Date(first); start.setDate(1 - first.getDay());
  let html = "일월화수목금토".split("").map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const ds = ymd(d);
    const items = tasks.filter(t => t.date === ds), shown = items.slice(0, 3);
    html += `<div class="day ${d.getMonth()!==viewM?"other":""} ${ds===todayStr?"today":""}" data-date="${ds}">
      <div class="dnum">${d.getDate()}</div>
      ${shown.map(t => `<span class="chip ${t.status}" draggable="true" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</span>`).join("")}
      ${items.length > 3 ? `<span class="more">+${items.length-3}개</span>` : ""}</div>`;
  }
  $("cal").innerHTML = html;
}
function renderDetail(){
  const el = $("detail"), t = tasks.find(x => x.id === selId);
  if (!t) { el.innerHTML = `<div class="empty">업무를 고르면 상태·일정·메모를 고칠 수 있어요.</div>`; return; }
  const idx = tasks.indexOf(t);
  el.innerHTML = `
    <label>업무 이름 <span class="hint">#${idx+1}</span></label><input id="f-title" value="${esc(t.title)}">
    <label>상태</label>
    <div class="status-pick">${Object.entries(ST).map(([k,v]) => `<button class="${k} ${t.status===k?"on":""}" data-s="${k}">${v}</button>`).join("")}</div>
    <div class="row">
      <div><label>일정</label><input type="date" id="f-date" value="${t.date||""}"></div>
      <div><label>담당</label><input id="f-owner" value="${esc(t.owner||"")}" list="owners"></div>
    </div>
    <datalist id="owners">${[...new Set(tasks.map(x=>x.owner).filter(Boolean))].map(o=>`<option value="${esc(o)}">`).join("")}</datalist>
    <label>단계</label><input id="f-phase" value="${esc(t.phase||"")}" list="phases">
    <datalist id="phases">${[...new Set(tasks.map(x=>x.phase))].map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
    <label>메모</label><textarea id="f-memo" placeholder="진행 상황, 참고 링크, 막힌 점 등">${esc(t.memo||"")}</textarea>
    <div class="actions">
      <button class="btn" id="upBtn">↑ 위로</button><button class="btn" id="downBtn">↓ 아래로</button>
      <span style="flex:1"></span><button class="btn danger" id="delBtn">삭제</button></div>`;
  const bind = (id, key) => $(id).addEventListener("input", e => { t[key] = e.target.value; save(); renderSummary(); renderTabs(); renderList(); renderCal(); });
  bind("f-title","title"); bind("f-memo","memo"); bind("f-date","date"); bind("f-owner","owner");
  $("f-phase").addEventListener("change", e => { t.phase = e.target.value; save(); render(); });
  el.querySelectorAll(".status-pick button").forEach(b => b.onclick = () => { t.status = b.dataset.s; save(); render(); });
  $("upBtn").onclick = () => move(idx, -1);
  $("downBtn").onclick = () => move(idx, 1);
  $("delBtn").onclick = () => { if (!confirm("이 업무를 삭제할까요?")) return; tasks.splice(idx, 1); selId = null; save(); render(); };
}
function move(i, d){ const j = i + d; if (j < 0 || j >= tasks.length) return; [tasks[i], tasks[j]] = [tasks[j], tasks[i]]; save(); render(); }
function select(id){
  selId = id; const t = tasks.find(x => x.id === id);
  if (t && t.date) { const [y, m] = t.date.split("-"); viewY = +y; viewM = +m - 1; }
  render();
}

$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; render(); } });
$("search").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); renderList(); });
$("list").addEventListener("click", e => {
  const ph = e.target.closest(".phase"); if (ph) { const p = ph.dataset.phase; closed.has(p) ? closed.delete(p) : closed.add(p); renderList(); return; }
  const it = e.target.closest(".item"); if (it) select(it.dataset.id);
});
$("cal").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) { selId = c.dataset.id; render(); } });
$("prevM").onclick = () => { if (--viewM < 0) { viewM = 11; viewY--; } renderCal(); };
$("nextM").onclick = () => { if (++viewM > 11) { viewM = 0; viewY++; } renderCal(); };
$("todayBtn").onclick = () => { viewY = now.getFullYear(); viewM = now.getMonth(); renderCal(); };
$("addBtn").onclick = () => {
  const sel = tasks.find(x => x.id === selId);
  const t = {id:uid(), phase: sel ? sel.phase : P.week, title:"새 업무", status:"todo", date:"", owner:ME, memo:""};
  tasks.splice(sel ? tasks.indexOf(sel) + 1 : tasks.length, 0, t);
  selId = t.id; filter = "all"; closed.delete(t.phase); save(); render(); $("f-title").select();
};
$("resetBtn").onclick = () => { if (!confirm("처음 목록으로 되돌릴까요? 고친 내용이 모두 사라져요.")) return; tasks = SEED.map(t => ({id:uid(), ...t})); selId = null; save(); render(); };

// 드래그: 목록·달력 칩 → 날짜 칸(일정), 목록 안(순서)
document.addEventListener("dragstart", e => { const n = e.target.closest("[data-id]"); if (!n) return; dragId = n.dataset.id; n.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
document.addEventListener("dragend", e => { document.querySelectorAll(".dragging,.drop").forEach(x => x.classList.remove("dragging","drop")); dragId = null; });
$("cal").addEventListener("dragover", e => { const d = e.target.closest(".day"); if (d && dragId) { e.preventDefault(); document.querySelectorAll(".day.drop").forEach(x => x !== d && x.classList.remove("drop")); d.classList.add("drop"); } });
$("cal").addEventListener("drop", e => { const d = e.target.closest(".day"); if (!d || !dragId) return; e.preventDefault();
  const t = tasks.find(x => x.id === dragId); if (t) { t.date = d.dataset.date; selId = t.id; save(); render(); } });
$("list").addEventListener("dragover", e => { if (e.target.closest(".item") && dragId) e.preventDefault(); });
$("list").addEventListener("drop", e => { const it = e.target.closest(".item"); if (!it || !dragId || it.dataset.id === dragId) return; e.preventDefault();
  const from = tasks.findIndex(x => x.id === dragId); const [m] = tasks.splice(from, 1);
  const to = tasks.findIndex(x => x.id === it.dataset.id); m.phase = tasks[to].phase; tasks.splice(to, 0, m); save(); render(); });

$("exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(tasks, null, 2)], {type:"application/json"}));
  a.download = `backend-tracker-${todayStr}.json`; a.click();
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const data = JSON.parse(await f.text()); if (!Array.isArray(data)) throw 0;
    tasks = data.map(t => ({id:t.id||uid(), phase:t.phase||"", title:t.title||"", status:ST[t.status]?t.status:"todo", date:t.date||"", owner:t.owner||"", memo:t.memo||""}));
    selId = null; save(); render(); } catch { alert("올바른 트래커 JSON 파일이 아니에요."); }
  e.target.value = "";
};
$("themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(dark ? "light" : "dark");
};
try { const th = localStorage.getItem(KEY+"-theme"); if (th) setTheme(th); } catch(e){}
load(); render();
</script>
</body>
</html>
